name: build

# Cross-platform CI for ai_space: builds the GUI executable for
# Linux / macOS / Windows, x64 & arm64, uploads archives as workflow
# artifacts on every push, and attaches them to a GitHub Release on v* tags.
# Reference: weibaohui/k8m build-release.yml + CUI's own CI matrix.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.35 base so binaries run on most distros from 2022 on
          - { name: linux-x64,       os: ubuntu-22.04 }
          - { name: linux-arm64,     os: ubuntu-22.04-arm }
          # macos-14/13 pools proved unreliable (jobs cancelled at scheduling);
          # macos-15 host cross-builds every macOS slice via CMAKE_OSX_ARCHITECTURES
          - { name: macos-arm64,     os: macos-15 }
          - { name: macos-x64,       os: macos-15, osx_arch: x86_64 }
          - { name: macos-universal, os: macos-15, osx_arch: "arm64;x86_64" }
          - { name: windows-x64,     os: windows-latest, msystem: MINGW64,     cc: gcc }
          - { name: windows-arm64,   os: windows-11-arm, msystem: CLANGARM64,  cc: clang }

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update -q &&
          sudo apt-get install -y -q
          libx11-dev libsqlite3-dev ninja-build
          xvfb libgl1 libgl1-mesa-dri

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: false
          msystem: ${{ matrix.msystem }}
          install: >-
            ${{ matrix.msystem == 'MINGW64' && 'mingw-w64-x86_64-gcc' || 'mingw-w64-clang-aarch64-clang' }}
            ${{ matrix.msystem == 'MINGW64' && 'mingw-w64-x86_64-cmake' || 'mingw-w64-clang-aarch64-cmake' }}
            ${{ matrix.msystem == 'MINGW64' && 'mingw-w64-x86_64-ninja' || 'mingw-w64-clang-aarch64-ninja' }}
            ${{ matrix.msystem == 'MINGW64' && 'mingw-w64-x86_64-sqlite3' || 'mingw-w64-clang-aarch64-sqlite3' }}

      - name: Configure (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          CFG="-S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release"
          if [ -n "${{ matrix.osx_arch }}" ]; then
            CFG="$CFG -DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx_arch }}"
          fi
          cmake $CFG

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_PREFIX_PATH="$MSYSTEM_PREFIX"

      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build build --parallel

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Smoke test under Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 1400x1000x24" \
            env CUI_SCREENSHOT=smoke.png CUI_SCREENSHOT_FRAMES=30 ./build/ai_space
          test -s smoke.png

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          NAME="ai_space-${{ github.ref_name }}-${{ matrix.name }}"
          mkdir -p pack/ai_space
          cp build/ai_space pack/ai_space/
          strip pack/ai_space/ai_space || true
          cp -r fonts pack/ai_space/fonts
          cp README.md pack/ai_space/README.md
          # desktop integration: icon + .desktop file, see README for install paths
          cp assets/icon_256.png pack/ai_space/com.weibaohui.ai-space.png
          cp assets/com.weibaohui.ai-space.desktop pack/ai_space/
          tar czf "pack/${NAME}.tar.gz" -C pack ai_space
          ls -l pack

      - name: Package (macOS .app bundle)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VER=$(sed -n 's/^#define AI_SPACE_VERSION "\(.*\)".*/\1/p' include/version.h)
          NAME="ai_space-${{ github.ref_name }}-${{ matrix.name }}"
          STAGE="pack/${NAME}"
          APP="$STAGE/AI-Space.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/ai_space "$APP/Contents/MacOS/ai_space"
          strip "$APP/Contents/MacOS/ai_space" || true
          cp assets/icon.icns "$APP/Contents/Resources/AppIcon.icns"
          # CJK font travels inside the bundle; the app resolves it beside the executable
          cp -R fonts "$APP/Contents/MacOS/fonts"
          sed "s/__VERSION__/${VER#v}/" assets/Info.plist > "$APP/Contents/Info.plist"
          # ad-hoc signature: required for local arm64 execution, not a notarized identity
          codesign --force --sign - "$APP"
          cp README.md "$STAGE/README.md"
          ditto -c -k --sequesterRsrc "$STAGE" "pack/${NAME}.zip"
          ls -l pack

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          NAME="ai_space-${{ github.ref_name }}-${{ matrix.name }}"
          mkdir -p pack/ai_space
          cp build/ai_space.exe pack/ai_space/
          cp -r fonts pack/ai_space/fonts
          cp README.md pack/ai_space/README.md
          cd pack
          powershell -NoProfile -Command "Compress-Archive -Path ai_space -DestinationPath '${NAME}.zip' -Force"
          ls -l

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai_space-${{ matrix.name }}
          path: pack/ai_space-*
          if-no-files-found: error

      - name: Upload to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: pack/ai_space-${{ github.ref_name }}-*
          tag: ${{ github.ref }}
          release_name: Release ${{ github.ref_name }}
          overwrite: true
          file_glob: true
