name: build

# Cross-platform CI for ai_space: builds the GUI executable for
# Linux / macOS / Windows, x64 & arm64, uploads archives as workflow
# artifacts on every push, and attaches them to a GitHub Release on v* tags.
# Reference: weibaohui/k8m build-release.yml + CUI's own CI matrix.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # zig cc pins the glibc symbol baseline to 2.17 (CentOS 7 / RHEL7 era,
          # 2012+), so the produced binaries run on virtually every distro still
          # in service regardless of the (much newer) runner they were built on
          - { name: linux-x64,   os: ubuntu-24.04,     zig_target: x86_64-linux-gnu.2.17 }
          - { name: linux-arm64, os: ubuntu-24.04-arm, zig_target: aarch64-linux-gnu.2.17 }
          # macos-14/13 pools proved unreliable (jobs cancelled at scheduling);
          # macos-15 host cross-builds every macOS slice via CMAKE_OSX_ARCHITECTURES.
          # DEPLOYMENT_TARGET 10.13 matches Info.plist LSMinimumSystemVersion
          - { name: macos-arm64,     os: macos-15 }
          - { name: macos-x64,       os: macos-15, osx_arch: x86_64 }
          - { name: macos-universal, os: macos-15, osx_arch: "arm64;x86_64" }
          - { name: windows-x64,     os: windows-latest, msystem: MINGW64,     cc: gcc }
          - { name: windows-arm64,   os: windows-11-arm, msystem: CLANGARM64,  cc: clang }

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update -q &&
          sudo apt-get install -y -q
          libx11-dev libsqlite3-dev ninja-build binutils
          xvfb libgl1 libgl1-mesa-dri

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up zig (Linux glibc baseline)
        if: matrix.zig_target != ''
        run: |
          ZIG_VER=0.17.1
          ARCH=$(uname -m)   # x86_64 | aarch64
          # resolve the tarball URL from the official index (naming changed across versions)
          ZIG_URL=$(curl -sL https://ziglang.org/download/index.json | \
            python3 -c "import json,sys; print(json.load(sys.stdin)['${ZIG_VER}']['${ARCH}-linux']['tarball'])")
          echo "zig url: $ZIG_URL"
          curl -fL --retry 3 -o /tmp/zig.tar.xz "$ZIG_URL"
          sudo mkdir -p /usr/local/zig
          sudo tar xf /tmp/zig.tar.xz -C /usr/local/zig --strip-components=1
          echo "/usr/local/zig" >> "$GITHUB_PATH"
          # GITHUB_PATH only takes effect on the NEXT step; verify via absolute path
          /usr/local/zig/zig version

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: false
          msystem: ${{ matrix.msystem }}
          install: >-
            ${{ matrix.msystem == 'MINGW64' && 'mingw-w64-x86_64-gcc' || 'mingw-w64-clang-aarch64-clang' }}
            ${{ matrix.msystem == 'MINGW64' && 'mingw-w64-x86_64-cmake' || 'mingw-w64-clang-aarch64-cmake' }}
            ${{ matrix.msystem == 'MINGW64' && 'mingw-w64-x86_64-ninja' || 'mingw-w64-clang-aarch64-ninja' }}
            ${{ matrix.msystem == 'MINGW64' && 'mingw-w64-x86_64-sqlite3' || 'mingw-w64-clang-aarch64-sqlite3' }}

      - name: Configure (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          CFG="-S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release"
          if [ -n "${{ matrix.zig_target }}" ]; then
            # zig cc as compiler driver; semicolon list passes the target through
            CFG="$CFG -DCMAKE_C_COMPILER=zig;cc;-target;${{ matrix.zig_target }}"

            # vendor the SQLite amalgamation: a statically built sqlite3 removes
            # the libsqlite3.so dependency whose glibc-2.34+ symbol needs would
            # otherwise poison the 2.17 baseline (X11/GL stay on the host)
            mkdir -p third_party/sqlite
            curl -fL --retry 3 -o /tmp/sqlite.zip \
              "https://www.sqlite.org/2025/sqlite-amalgamation-3490100.zip"
            unzip -q -o /tmp/sqlite.zip -d /tmp/sqlite-src
            cp /tmp/sqlite-src/sqlite-amalgamation-3490100/sqlite3.{c,h} third_party/sqlite/

            # runner .so files (libX11/libGL) reference newer glibc symbols; the
            # binary only records DT_NEEDED for them and resolves them at runtime
            # from the HOST system (AppImage semantics), so skip link-time checks
            CFG="$CFG -DCMAKE_EXE_LINKER_FLAGS=-Wl,--allow-shlib-undefined"

            # zig's compiler id confuses CMake's multiarch lib discovery, so hand
            # FindX11 the real .so path from the multiarch dir (sqlite3 is static now)
            X11LIB=$(find /usr/lib -name 'libX11.so' 2>/dev/null | head -1)
            echo "X11=$X11LIB"
            CFG="$CFG -DX11_X11_LIB=$X11LIB"
          fi
          if [ -n "${{ matrix.osx_arch }}" ]; then
            CFG="$CFG -DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx_arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13"
          fi
          cmake $CFG

      - name: Assert glibc baseline (Linux)
        if: matrix.zig_target != ''
        run: |
          MAX=$(objdump -T build/ai_space | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "highest glibc symbol version: $MAX"
          if [ "$(printf 'GLIBC_2.17\n%s\n' "$MAX" | sort -V | tail -1)" != "GLIBC_2.17" ]; then
            echo "::error::binary requires glibc newer than 2.17 ($MAX)"
            exit 1
          fi

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_PREFIX_PATH="$MSYSTEM_PREFIX"

      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build build --parallel

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Smoke test under Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 1400x1000x24" \
            env CUI_SCREENSHOT=smoke.png CUI_SCREENSHOT_FRAMES=30 ./build/ai_space
          test -s smoke.png

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          NAME="ai_space-${{ github.ref_name }}-${{ matrix.name }}"
          mkdir -p pack/ai_space
          cp build/ai_space pack/ai_space/
          strip pack/ai_space/ai_space || true
          cp -r fonts pack/ai_space/fonts
          cp README.md pack/ai_space/README.md
          # desktop integration: icon + .desktop file, see README for install paths
          cp assets/icon_256.png pack/ai_space/com.weibaohui.ai-space.png
          cp assets/com.weibaohui.ai-space.desktop pack/ai_space/
          tar czf "pack/${NAME}.tar.gz" -C pack ai_space

          # ---- AppImage: self-contained bundle for any distro -------------------
          # linuxdeploy scans the binary's ELF deps and bundles the app-level
          # ones (libsqlite3.so.0 ...) into AppDir/usr/lib with an $ORIGIN rpath.
          # glibc/libGL/X11 stay on the host per the official excludelist.
          export APPIMAGE_EXTRACT_AND_RUN=1   # run AppImage tools without FUSE
          ARCH=$(uname -m)                    # x86_64 | aarch64
          curl -sL -o linuxdeploy.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${ARCH}.AppImage"
          chmod +x linuxdeploy.AppImage

          APPDIR=AI-Space.AppDir
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp build/ai_space "$APPDIR/usr/bin/"
          strip "$APPDIR/usr/bin/ai_space" || true
          cp -r fonts "$APPDIR/usr/bin/fonts"   # CJK font, resolved beside the exe
          # icon placed manually to match the desktop Icon= entry exactly
          cp assets/icon_256.png \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps/com.weibaohui.ai-space.png"
          ./linuxdeploy.AppImage --appdir "$APPDIR" \
            -e "$APPDIR/usr/bin/ai_space" \
            -d assets/com.weibaohui.ai-space.desktop \
            --output appimage
          mv AI-Space-*.AppImage "pack/${NAME}.AppImage"

          # smoke test: the AppImage itself must run under Xvfb and render
          env CUI_SCREENSHOT=appimage_smoke.png CUI_SCREENSHOT_FRAMES=30 \
            xvfb-run -a -s "-screen 0 1400x1000x24" "./pack/${NAME}.AppImage" --appimage-extract-and-run
          test -s appimage_smoke.png
          ls -l pack

      - name: Package (macOS .app bundle)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VER=$(sed -n 's/^#define AI_SPACE_VERSION "\(.*\)".*/\1/p' include/version.h)
          NAME="ai_space-${{ github.ref_name }}-${{ matrix.name }}"
          STAGE="pack/${NAME}"
          APP="$STAGE/AI-Space.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/ai_space "$APP/Contents/MacOS/ai_space"
          strip "$APP/Contents/MacOS/ai_space" || true
          cp assets/icon.icns "$APP/Contents/Resources/AppIcon.icns"
          # CJK font travels inside the bundle as a resource (MacOS/ must hold code
          # only, or codesign rejects the bundle); resolved via ../Resources fallback
          cp -R fonts "$APP/Contents/Resources/fonts"
          sed "s/__VERSION__/${VER#v}/" assets/Info.plist > "$APP/Contents/Info.plist"
          # ad-hoc signature: required for local arm64 execution, not a notarized identity
          codesign --force --sign - "$APP"
          cp README.md "$STAGE/README.md"
          ditto -c -k --sequesterRsrc "$STAGE" "pack/${NAME}.zip"
          ls -l pack

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          NAME="ai_space-${{ github.ref_name }}-${{ matrix.name }}"
          mkdir -p pack/ai_space
          cp build/ai_space.exe pack/ai_space/
          cp -r fonts pack/ai_space/fonts
          cp README.md pack/ai_space/README.md
          cd pack
          powershell -NoProfile -Command "Compress-Archive -Path ai_space -DestinationPath '${NAME}.zip' -Force"
          ls -l

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai_space-${{ matrix.name }}
          path: pack/ai_space-*
          if-no-files-found: error

      - name: Upload to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: pack/ai_space-${{ github.ref_name }}-*
          tag: ${{ github.ref }}
          release_name: Release ${{ github.ref_name }}
          overwrite: true
          file_glob: true
